<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>VINDOT LLC Contact Form</title>
    <link rel="shortcut icon" type="image/x-icon" href="/images/favicon-16x16.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- <p style="color: black;" id="demo">Hi</p>
    <script>
        var w = window.innerWidth;
        var h = window.innerHeight;

        var x = document.getElementById("demo");
        x.innerHTML = "Browser width: " + w + ", height: " + h + ".";

    <div class="form">
        <form id="myForm">
            <!-- form action should be a target url -->
            <div>
                <p>
                <div class="row">
                    <div class="column">
                        <img src="./images/16_bit_house.jpg" alt="logo" height="110px" width="120px">
                        <div class="column">
                            <div class="row">
                                <h4>
                                    VINDOT LLC<br>
                                    Saint Louis, MO<br>
                                    Contact Info:<br>
                                    owners@vindot.llc

                                </h4>
                            </div>
                        </div>
                        </p>
                    </div>
                    <p style="font-size: larger;">We appreciate your residency!</p>

                </div>

                <div class="container">

                </div>

                <input type="email" class="textinput" id="email" name="email"
                    placeholder="Please enter your Vindot buildium email" required title="Please enter a valid email address"
                    maxlength="64">

                <br>
                <br>
                <input type="text" class="textinput" id="unit" name="unit" placeholder="Please enter your unit - ex: 5069A"
                    required>
                <br>
                </p>
                <label for="textarea"></label>
                <p style="font-size: larger;">How can we help?</p>
                <textarea class="textinput" id="text" name="text" rows="10" cols="50"
                    style="text-align:left; vertical-align:top; padding:10px"></textarea>
                <br>
                <br>

                <div class="container">
                    <input type="submit" value="Submit" id="submit" style="height:50px; width:100px;">
                    <input type="reset" value="Reset" style="height:50px; width:100px">
                </div>
            </div>
            <p id="responseMessage" style="display: none; text-align: center"></p>
            <!-- Area to display the response message -->
        </form>


    </div>

    <script>
        // Reset form if coming from not-current-tenant page
        if (new URLSearchParams(window.location.search).get('reset') === 'true') {
            document.getElementById('myForm').reset();
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        document.getElementById('myForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const unit = document.getElementById('unit').value;
            const text = document.getElementById('text').value;

            const queryString = `email=${encodeURIComponent(email)}&unit=${encodeURIComponent(unit)}&text=${encodeURIComponent(text)}`;
            const url = `https://1xbqvgjn40.execute-api.us-east-2.amazonaws.com/dev/?${queryString}`;
            const redirectUrl = '/not-current-tenant.html'
            console.log(url)
            console.log(redirectUrl)
            fetch(url, {
                method: 'POST'
            })
                .then(response => {
                    console.log('Status Code:', response.status);
                    if (response.status === 200) {
                        document.getElementById('myForm').reset();
                        window.location.href = 'thank-you.html';
                    } else if (response.status === 401 || response.status === 302) {
                        window.location.href = redirectUrl;
                    } else {
                        throw new Error('Request failed');
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                    const responseMessage = document.getElementById('responseMessage');
                    responseMessage.textContent = 'An error occurred while processing your request. Please check your user information.';
                    responseMessage.style.display = 'block';
                });
        });
    </script>
</body>

</html>
